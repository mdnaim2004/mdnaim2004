name: Generate Snake

# run every 6 hours + manual trigger
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# give Actions explicit write permission so pushes work
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # checkout repository
      - uses: actions/checkout@v4

      # generate snake (Platane/snk)
      - name: Generate snake (Platane/snk)
        uses: platane/snk@master
        id: snake
        with:
          github_user_name: mdnaim2004
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg
          # provide token in case the action needs API access
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show git status (debug)
        run: |
          ls -la
          git status
          echo "Files in dist:"
          ls -la dist || true

      # Push generated files to 'output' branch (not master/main)
      - name: Push generated output to output branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: output
          force: true

      # Optionally publish to GitHub Pages from the 'output' branch
      - name: Publish to GitHub Pages (from output)
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
